---
title: All posts
show_tags: true
permalink: blog/index.html
---

<div class="d-md-block d-lg-none mb-3">
    {% include components/all-tags.html %}
</div>

<div id="currently-showing">
    <h2 class="d-flex align-items-center mb-3">
        <span class="text-secondary me-2">Showing everything matching:</span>
        <span class="border rounded p-2 me-2 bg-light text-secondary" id="active-tag"></span>
        <a class="btn btn-primary btn-small" href="javascript:void(0)" onclick="clearTags()">clear</a>
    </h2>
</div>

{% capture written_year %}'None'{% endcapture %}
{% for post in site.posts %}

    {% include components/post-card.html %}

{% endfor %}

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        if (document.location.hash.length > 0) {
            var tag = document.location.hash.slice(1);
            var el = document.querySelector('.tag-' + tag);
            var name = el ? el.textContent.trim() : '';
            showPostByTag(tag, name);
        } else {
            document.getElementById('currently-showing').style.display = 'none';
        }
    });

    var showPostByTag = function(tag, name) {
        document.getElementById('currently-showing').style.display = '';
        document.querySelectorAll('.card-post').forEach(function(card) {
            card.style.display = 'none';
        });
        document.querySelectorAll('.tag').forEach(function(el) {
            el.classList.remove('bg-warning', 'text-dark');
            el.classList.add('bg-white');
        });
        document.querySelectorAll('.card-post').forEach(function(card) {
            if (card.querySelector('.tag-' + tag)) {
                card.style.display = '';
            }
        });
        document.querySelectorAll('.tag-' + tag).forEach(function(el) {
            el.classList.remove('bg-white');
            el.classList.add('bg-warning', 'text-dark');
            el.blur();
        });
        document.getElementById('active-tag').textContent = name;
    };

    var clearTags = function() {
        document.getElementById('currently-showing').style.display = 'none';
        document.querySelectorAll('.card-post').forEach(function(card) {
            card.style.display = '';
        });
        document.querySelectorAll('.tag').forEach(function(el) {
            el.classList.remove('bg-warning', 'text-dark');
            el.classList.add('bg-white');
        });
        document.location.hash = '';
    };
</script>
